<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Sistema de Limpieza'">Sistema de Limpieza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h4>Limpieza</h4>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="/" th:classappend="${section == 'dashboard'} ? 'active' : ''">
                        Inicio
                    </a>
                </li>
                <li class="nav-item section-title">Clientes</li>
                <li class="nav-item">
                    <a class="nav-link ps-4" href="/clients" th:classappend="${section == 'clients'} ? 'active' : ''">
                        Ver todos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link ps-4" href="javascript:void(0)" onclick="toggleForm('searchClientForm')">
                        Buscar cliente
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link ps-4" href="javascript:void(0)" onclick="toggleForm('addClientForm')">
                        Agregar cliente
                    </a>
                </li>

                <li class="nav-item section-title">Empleados</li>
                <li class="nav-item">
                    <a class="nav-link ps-4" href="/employees" th:classappend="${section == 'employees'} ? 'active' : ''">
                        Ver todos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link ps-4" href="javascript:void(0)" onclick="toggleForm('searchEmployeeForm')">
                        Buscar empleado
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link ps-4" href="javascript:void(0)" onclick="toggleForm('addEmployeeForm')">
                        Agregar empleado
                    </a>
                </li>

                <li class="nav-item section-title">Servicios</li>
                <li class="nav-item">
                    <a class="nav-link ps-4" href="/services" th:classappend="${section == 'services'} ? 'active' : ''">
                        Ver todos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link ps-4" href="javascript:void(0)" onclick="toggleForm('filterServiceForm')">
                        Filtrar por estado
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link ps-4" href="javascript:void(0)" onclick="toggleForm('searchServiceForm')">
                        Buscar servicio
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link ps-4" href="javascript:void(0)" onclick="toggleForm('addServiceForm')">
                        Agregar servicio
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <header class="app-header">
                <h2 th:text="${pageTitle} ?: 'Sistema de Gestión de Limpieza'"></h2>
            </header>

            <!-- Messages -->
            <div th:if="${message}" class="alert" th:classappend="${messageType == 'success'} ? 'alert-success' : 'alert-danger'">
                <span th:text="${message}"></span>
            </div>

            <!-- Content -->
            <div class="content-area">
                <div th:replace="this :: content"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
