# ==============================
# PUERTO (Railway lo asigna solo)
# ==============================
server.port=${PORT:8080}

# ==============================
# BASE DE DATOS (Local vs Railway)
# ==============================
# Si existe MYSQL_URL, la usa. Si no, usa las variables por partes.
# Si ninguna existe, usa tu localhost para seguir programando localmente.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:proyecto_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:sebas555}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ==============================
# THYMELEAF (desarrollo)
# ==============================
spring.thymeleaf.cache=false
